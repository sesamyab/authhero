name: Gitleaks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      # Run the MIT-licensed gitleaks CLI directly. gitleaks-action requires a
      # paid GITLEAKS_LICENSE for organization-owned repos; the CLI does not.
      # .gitleaksignore (if present) is picked up from the repo root.
      - name: gitleaks (pull request commits)
        if: github.event_name == 'pull_request'
        run: |
          docker run --rm -v "${{ github.workspace }}:/repo" \
            ghcr.io/gitleaks/gitleaks:v8.30.1 git /repo --redact -v \
            --config /repo/.gitleaks.toml \
            --log-opts="${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"

      # Scan only the commits in this push, as gitleaks-action did. The full
      # history holds older findings that predate this check.
      - name: gitleaks (pushed commits)
        if: github.event_name != 'pull_request'
        run: |
          docker run --rm -v "${{ github.workspace }}:/repo" \
            ghcr.io/gitleaks/gitleaks:v8.30.1 git /repo --redact -v \
            --config /repo/.gitleaks.toml \
            --log-opts="${{ github.event.before }}..${{ github.sha }}"
