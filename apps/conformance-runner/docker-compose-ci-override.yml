# Layered on top of the upstream docker-compose-dev-mac.yml when starting the
# OIDF conformance suite on Linux CI runners. Docker Desktop on Mac auto-
# populates host.docker.internal in containers' /etc/hosts; Linux Docker does
# not, so without this override the suite's server container fails every
# discovery fetch with "host.docker.internal: Name or service not known".
# host-gateway is a Docker magic value that resolves to the container's host
# gateway, letting the suite reach the auth-server bound to 0.0.0.0:3000 on
# the runner.
#
# The inline Dockerfile replaces upstream server-dev/Dockerfile, which runs
# `apt-get install redir` on eclipse-temurin:21 (Ubuntu). GitHub-hosted runners
# currently can't resolve *.ubuntu.com hosts (archive, security and the azure
# mirror all fail with "Could not resolve"), while Debian's mirrors work (the
# suite's Debian-based nginx image builds fine). So install redir from Debian
# in a throwaway stage and copy the binary across; it only links against libc,
# and the Ubuntu target's glibc is newer than Debian's.
services:
  server:
    build:
      dockerfile_inline: |
        FROM debian:trixie-slim AS redir
        RUN apt-get update && apt-get install -y --no-install-recommends redir
        FROM eclipse-temurin:21
        COPY --from=redir /usr/bin/redir /usr/bin/redir
        RUN test -x /usr/bin/redir && ! ldd /usr/bin/redir | grep -q "not found"
    extra_hosts:
      - "host.docker.internal:host-gateway"
