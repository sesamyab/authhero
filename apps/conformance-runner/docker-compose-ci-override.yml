# Layered on top of the upstream docker-compose-dev-mac.yml when starting the
# OIDF conformance suite on Linux CI runners. Docker Desktop on Mac auto-
# populates host.docker.internal in containers' /etc/hosts; Linux Docker does
# not, so without this override the suite's server container fails every
# discovery fetch with "host.docker.internal: Name or service not known".
# host-gateway is a Docker magic value that resolves to the container's host
# gateway, letting the suite reach the auth-server bound to 0.0.0.0:3000 on
# the runner.
#
# The inline Dockerfile replaces upstream server-dev/Dockerfile. GitHub-hosted
# runners can't resolve archive.ubuntu.com / security.ubuntu.com (the runner's
# DNS refuses them; the runner itself uses the Azure mirror), so upstream's
# plain `apt-get update` fails with "Could not resolve 'archive.ubuntu.com'".
# Same image otherwise: install redir on eclipse-temurin:21, but via
# azure.archive.ubuntu.com.
services:
  server:
    build:
      dockerfile_inline: |
        FROM eclipse-temurin:21
        RUN for f in /etc/apt/sources.list /etc/apt/sources.list.d/*.sources; do \
              [ -f "$$f" ] && sed -i -E 's#https?://(archive|security)\.ubuntu\.com#http://azure.archive.ubuntu.com#g' "$$f"; \
            done; \
            apt-get update && apt-get install -y redir && rm -rf /var/lib/apt/lists/*
    extra_hosts:
      - "host.docker.internal:host-gateway"
